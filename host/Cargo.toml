[package]
name = "pocketpad"
version = "0.1.0"
edition = "2021"
authors = ["PocketPad Team"]
description = "Lightweight Android-to-Windows Wireless Xbox 360 Controller"

[lib]
name = "pocketpad_core"
path = "src/lib.rs"

[[bin]]
name = "pocketpad"
path = "src/main.rs"
test = false

[dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
rust-embed = "8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mime_guess = "2.0"
rand = "0.8"
